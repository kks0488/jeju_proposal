name: Public static portfolio check
on:
  push:
    branches: [master]
    paths: ['site-v3/live-check.cjs', '.github/workflows/portfolio-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node site-v3/live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portfolio-live-check
          path: site-v3/live-qa/
          retention-days: 14
