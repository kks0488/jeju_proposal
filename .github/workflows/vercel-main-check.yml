name: Vercel main page verification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/vercel-main-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify anonymous production root and every gallery image
        env:
          BASE_URL: 'https://jeju-proposal.vercel.app/'
        run: node site-v3/root-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-main-live-check
          path: site-v3/qa/root-*
          retention-days: 14
