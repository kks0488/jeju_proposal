name: Portfolio media and browser checks
on:
  push:
    branches: [master]
    paths: ['site-v3/*.mjs', 'site-v3/template.html', 'site-v3/app.js', 'site-v3/style.css', '.github/workflows/portfolio-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-media
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false cheerio@1.1.2 playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node site-v3/build.mjs
      - run: node site-v3/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-static-v3
          path: |
            site-v3/published/
            site-v3/qa/
          retention-days: 14
      - name: Commit verified static images and pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v3/published site-v3/qa/browser-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish three-contractor local image galleries after browser checks [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master
