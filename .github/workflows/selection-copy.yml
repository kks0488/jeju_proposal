name: Selection page editorial update
on:
  push:
    branches: [master]
    paths: ['site-v3/selection-edit.cjs', 'site-v3/selection-check.cjs', '.github/workflows/selection-copy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-media
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selection wording without refreshing images
        run: node site-v3/selection-edit.cjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node site-v3/selection-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-page-check
          path: |
            site-v3/qa/selection-*
          retention-days: 14
      - name: Commit tested selection page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v3/published/index.html site-v3/published/app.js site-v3/published/catalog.json site-v3/template.html site-v3/app.js site-v3/build.mjs site-v3/qa/selection-report.json index.html public-portfolio.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use 제주집 시공사 선정 and remove repeated public-review disclaimers [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master
